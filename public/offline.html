<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Offline · Crossbill</title>
<style>
  :root { --canvas: #ebe3d2; --ink: #111827; --muted: #374151; --line: #0369a1; --sky: #38bdf8; --sky-hover: #7dd3fc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  header { background: #fff; border-bottom: 2px solid var(--line); }
  .bar { max-width: 72rem; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
  .bar span { color: var(--line); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .panel { width: 100%; max-width: 30rem; padding: 28px 24px; border: 2px solid var(--line); border-radius: 16px; background: #fff; }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase; color: var(--line); }
  h1 { margin: 6px 0 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.15; }
  p { margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: var(--muted); }
  button { margin-top: 20px; display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 10px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--sky); color: var(--ink); font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--sky-hover); }
  button:focus-visible { outline: 3px solid var(--line); outline-offset: 3px; }
  .status { margin-top: 14px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="bar">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="24" cy="32" r="16" fill="#111827"/>
        <g fill="none" stroke="#fff" stroke-width="0.8" opacity="0.6"><ellipse cx="24" cy="32" rx="8" ry="16"/><ellipse cx="24" cy="32" rx="13.86" ry="16"/><path d="M16 45.86 H32 M10.14 40 H37.86 M8 32 H40 M10.14 24 H37.86 M16 18.14 H32"/></g>
        <path d="M30.2 22.8 C 27.7 20.3, 17.9 20.3, 17.9 26.5 C 17.9 32, 30.2 31.4, 30.2 37.5 C 30.2 43.7, 20.3 43.7, 17.9 41.2" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M24 18.5 V45.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M24 12.5 V15.5 M24 48.5 V51.5" stroke="#111827" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M36 24 C 46 25, 53 31, 59 42" stroke="#0369a1" stroke-width="3.2" stroke-linecap="round" fill="none"/>
        <path d="M36 40 C 46 39, 53 33, 59 22" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" fill="none"/>
        <circle cx="13" cy="26" r="2.9" fill="#111827"/><circle cx="13" cy="26" r="1.9" fill="#fff"/>
      </svg>
      <div>Cross<span>bill</span></div>
    </div>
  </header>
  <main>
    <div class="panel" role="status">
      <p class="eyebrow">No connection</p>
      <h1>You're offline</h1>
      <p>Crossbill needs the internet to reach PayPal. Nothing is lost: your invoices and payments live in PayPal, and your books rebuild the moment you're back.</p>
      <button type="button" id="retry">Try again</button>
      <p class="status" id="status">This page reloads by itself when the connection returns.</p>
    </div>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
